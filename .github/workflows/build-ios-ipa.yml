name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS application
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --verbose 2>&1 | tee build-ios.log

      - name: Show relevant build errors
        if: failure()
        shell: bash
        run: |
          echo "::group::Compiler errors"
          grep -nEi -B 3 -A 8 '(^|[[:space:]])(error:|fatal error:|exception:)|BUILD FAILED|Could not build' build-ios.log | tail -n 300 || true
          echo "::endgroup::"

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build-ios.log
          if-no-files-found: warn
          retention-days: 14

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          /usr/bin/zip -r ISDP-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISDP-unsigned-ipa
          path: build/ios/ipa/ISDP-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
